[project]
name = "backend"
version = "0.1.0"
description = "Patient dashboard API"
authors = [
    { name = "Alisa Bondar", email = "alisa.k.bondar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "en-core-web-sm",
    "faker>=40.43.0",
    "fastapi>=0.143.2",
    "presidio-analyzer>=2.2.364",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.170.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["db: needs the real test Postgres (deselect with -m 'not db')"]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's async engine switches greenlets; without this, lines after an await are missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the AI gateway makes outbound HTTP calls"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["httpx2", "httpx", "requests", "urllib3", "aiohttp", "google"]
ignore_imports = ["app.ai.gateway -> httpx2"]
# Importing the gateway is fine; only its own direct import of a client is allowed.
allow_indirect_imports = true
