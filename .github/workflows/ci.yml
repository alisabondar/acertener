name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan every commit, not just the latest
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Only the AI gateway makes outbound calls
        run: uv run lint-imports
      - name: Test (with coverage gate)
        run: uv run pytest --cov
      - name: Committed API contract (schema, role permissions) matches the API
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- ../frontend/src/api/openapi.json ../frontend/src/test/role-permissions.json
      - name: Security and AI-privacy modules need 100% branch coverage
        run: uv run coverage report --include="app/crypto/*,app/auth/permissions.py,app/ai/*" --fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generated API types match the committed schema
        run: |
          bun run api:generate
          git diff --exit-code -- src/api/schema.d.ts
      - name: Lint, format, type check, test
        run: bun run check
      - name: Coverage gate
        run: bun run test:coverage
      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: End-to-end tests on the Compose stack (mock AI, synthetic data, throwaway keys)
        env:
          SEED_COUNT: "2000"
        run: |
          cp .env.example .env
          ./dev.sh test e2e
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Upload traces and logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traces
          path: |
            frontend/test-results/
            compose.log
          retention-days: 7
