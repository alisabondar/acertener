# The whole app: ./dev.sh starts it (or `docker compose up --build`).
# Order: db (healthy) → keys-init → migrate → seed → api (healthy) → web.
name: patient-dashboard

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    # Inside Compose the database is the `db` service, whatever .env says for host runs.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
    TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}_test
    KEYS_DIR: /keys
    ENV: ${ENV:-development}
    DEMO_MODE: ${DEMO_MODE:-true}
  volumes:
    - keys:/keys

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Loopback only: the database is never reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  keys-init:
    <<: *backend
    command: ["python", "-m", "scripts.init_keys"]
    restart: "no"

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *backend
    # Skips itself when patients already exist; `./dev.sh reset` starts over.
    command: ["sh", "-c", "python -m scripts.seed --count $${SEED_COUNT:-10000}"]
    environment:
      <<: *backend-env
      SEED_COUNT: ${SEED_COUNT:-10000}
    restart: "no"
    depends_on:
      keys-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    command:
      ["uvicorn", "--factory", "app.main:create_app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - keys:/keys
      # Source mounted for hot reload; the virtualenv stays in the image at /opt/venv.
      - ./backend:/app/backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      # Lets the e2e container reach Vite by its service name.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: web
    volumes:
      - ./frontend:/app/frontend
      # Dependencies stay in a container volume, so native tools (Oxlint, Rolldown) match Linux.
      - web_node_modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:5173')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # `./dev.sh test e2e`: Playwright's own image, against the running web and api services.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /app/frontend
    environment:
      E2E_BASE_URL: http://web:5173
      CI: "true"
    volumes:
      - ./frontend:/app/frontend
      - web_node_modules:/app/frontend/node_modules
    # Runs the installed binary directly: npx is npm, which this Bun project's devEngines refuses.
    command: ["./node_modules/.bin/playwright", "test"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  # Encryption keys. Reset only together with pgdata: data encrypted with lost keys is unreadable.
  keys:
  web_node_modules:
